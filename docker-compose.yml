services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drrcs
      POSTGRES_USER: drrcs
      POSTGRES_PASSWORD: drrcs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drrcs -d drrcs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://drrcs:drrcs@postgres:5432/drrcs?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      EMAIL_FROM: alerts@drrcs.local
    ports:
      - "4000:4000"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-uploads:

